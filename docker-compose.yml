# Optional: local MySQL 8 + Redis for development.
#   docker compose up -d
# On first start MySQL runs database/schema.sql then database/seed.sql
# (files in /docker-entrypoint-initdb.d run in alphabetical order).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-medibook_root}
      MYSQL_DATABASE: medibook
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-medibook_root}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  mysql-data:
